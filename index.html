<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061225">
<title>DS FOREVER | Welcome Back</title>
<style>
:root{--gold:#f7c744;--gold2:#ffdf75;--blue:#22baff;--ink:#04101f;--muted:#b9c9df;--white:#f7f9ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--white)}
body{min-height:100vh;display:grid;place-items:center;padding:22px 14px;background:radial-gradient(ellipse at 50% 35%,#12345a 0%,#07172d 42%,#020812 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:16px;border:1px solid #168de866;transform:skewY(-7deg);pointer-events:none;box-shadow:0 0 24px #168de822,inset 0 0 25px #168de811}
body:after{inset:0;border:0;background:linear-gradient(135deg,transparent 0 12%,#f6c33a 12.1%,transparent 12.7% 87%,#f6c33a 87.1%,transparent 87.7%);opacity:.8}
.wrap{width:min(100%,520px);position:relative;padding:26px 22px 22px;border:1px solid #258be8aa;border-radius:28px;background:linear-gradient(155deg,#061b34ee,#020a17f5 70%);box-shadow:0 0 0 3px #071a30,0 0 42px #168de855,inset 0 0 45px #0b4d7a33;overflow:hidden}
.wrap:before{content:"";position:absolute;inset:9px;border:1px solid #f4c54455;border-radius:21px;pointer-events:none}
.brand{text-align:center;position:relative;margin:2px 0 20px}.crown{font-size:43px;line-height:1;color:var(--gold2);filter:drop-shadow(0 0 10px #ffc93c66)}
.monogram{font-size:clamp(58px,15vw,86px);font-weight:1000;letter-spacing:-8px;line-height:.98;background:linear-gradient(110deg,#ffcf48 10%,#fff8d8 47%,#8fcfff 75%,#e8b63c);color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 5px 24px #f3c34b22}
.brand h1{font-size:clamp(27px,7vw,39px);font-style:italic;letter-spacing:1px;margin:9px 0 7px;color:var(--gold2);text-shadow:0 0 18px #f5c34255}.balls{font-size:24px;letter-spacing:14px;margin:8px 0 14px}.welcome{font-size:clamp(30px,8vw,43px);font-weight:950;letter-spacing:.5px;margin:12px 0 2px}.welcome span{color:var(--gold)}.sub{font-size:17px;color:#e2eaf6;margin:0}.rule{height:3px;margin:19px 8px 24px;background:linear-gradient(90deg,transparent,var(--gold),#fff5b4,var(--blue),transparent);box-shadow:0 0 15px #f7c74488}
form{position:relative;padding:0 8px}.field{margin:18px 0}.field label{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;margin:0 0 9px}.field label .ico{font-size:22px;color:#f4f7ff}.input-wrap{position:relative}.input-wrap input{width:100%;height:62px;border:2px solid #479ee5;border-radius:23px;background:linear-gradient(100deg,#18314c,#10253d);box-shadow:0 0 15px #1e9bff30,inset 0 0 15px #06132688;color:white;padding:0 55px 0 58px;font-size:17px;outline:none}.input-wrap input:focus{border-color:#55d0ff;box-shadow:0 0 0 3px #31baff25,0 0 22px #22baff55}.input-wrap input::placeholder{color:#bdcbe0}.inside{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:24px;color:#c8d8ed;pointer-events:none}.toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#dbeaff;font-size:22px;cursor:pointer;padding:6px}.forgot{display:flex;justify-content:flex-end;margin:8px 4px 20px}.forgot button{border:0;background:none;color:var(--gold);font-size:16px;font-weight:800;cursor:pointer}.submit{width:100%;height:72px;border:2px solid #ffe68d;border-radius:28px;background:linear-gradient(180deg,#fff1a9 0%,#ffd34d 35%,#d99109 100%);box-shadow:0 0 0 3px #b77c1b55,0 0 25px #ffc52f77;color:#090d16;font-size:26px;font-weight:950;letter-spacing:1px;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.create{text-align:center;margin:20px 0 8px;font-size:18px;font-weight:750}.create button{border:0;background:none;color:var(--gold);font-size:18px;font-weight:900;cursor:pointer}.security{text-align:center;color:#e1e9f5;font-size:14px;margin:18px 0 0}.security b{color:var(--gold);padding:0 7px}.status{min-height:20px;text-align:center;font-size:13px;margin-top:12px;color:#d7e7ff;overflow-wrap:anywhere}.status.ok{color:#8df0ba}.status.err{color:#ff9a9a}.register-fields{display:none}.registering .register-fields{display:block}.registering .login-only{display:none}.foot{text-align:center;color:#8ea7c5;font-size:11px;margin:18px 0 0}.hidden{display:none!important}
@media(max-width:390px){.wrap{padding:22px 15px}.input-wrap input{height:56px;border-radius:18px}.submit{height:64px}.field label{font-size:16px}.sub{font-size:15px}}
</style></head>
<body><main class="wrap" id="card">
<header class="brand"><div class="crown">♛</div><div class="monogram">DS</div><h1>DS FOREVER</h1><div class="balls">🏏　⚽　🎾</div><div class="welcome" id="welcome">WELCOME <span>BACK</span></div><p class="sub" id="subtitle">Login to your DS FOREVER account</p></header>
<div class="rule"></div>
<form id="loginForm" novalidate>
<div class="register-fields"><div class="field"><label for="fullName"><span class="ico">👤</span> Full Name</label><div class="input-wrap"><span class="inside">👤</span><input id="fullName" type="text" placeholder="Enter your full name" autocomplete="name" maxlength="80"></div></div></div>
<div class="field"><label for="email"><span class="ico">🆔</span> User ID</label><div class="input-wrap"><span class="inside">🆔</span><input id="email" type="text" placeholder="Enter your User ID" autocomplete="username" required></div></div>
<div class="field"><label for="password"><span class="ico">🔒</span> Password</label><div class="input-wrap"><span class="inside">🔒</span><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="8" required><button class="toggle" id="togglePassword" type="button" aria-label="Show password">◉</button></div></div>
<div class="forgot login-only"><button id="forgot" type="button">Forgot Password?</button></div>
<button class="submit" id="submit" type="submit">⇥ &nbsp; LOGIN</button>
<div class="create"><span id="createText">New User?</span> <button id="switchMode" type="button">Create Account</button></div>
<div class="status" id="status" aria-live="polite"></div>
</form>
<div class="security">🛡️<br>Secure Login <b>•</b> Free Sports Updates <b>•</b> Sports Center</div><footer class="foot">DS FOREVER © 2026</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://gplftdgweysvutrfkpni.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_YSRfi0A-OZ2PpeJFOqsRNw_ee5z30VU";const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let registering=false;
function msg(t,c=""){$("status").textContent=t;$('status').className="status "+c}
$('togglePassword').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('togglePassword').textContent=p.type==='password'?'◉':'◎'};
$('switchMode').onclick=()=>{registering=!registering;$('card').classList.toggle('registering',registering);$('welcome').innerHTML=registering?'CREATE <span>ACCOUNT</span>':'WELCOME <span>BACK</span>';$('subtitle').textContent=registering?'Create your DS FOREVER account':'Login to your DS FOREVER account';$('createText').textContent=registering?'Already registered?':'New User?';$('switchMode').textContent=registering?'Login':'Create Account';$('submit').textContent=registering?'✦  CREATE ACCOUNT':'⇥  LOGIN';$('fullName').required=registering;msg('')};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;msg(registering?'Creating account…':'Logging in…');try{const id=$('email').value.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{1,18}[a-z0-9]$/.test(id))throw new Error('User ID 3-20 characters ka hona chahiye');const email=id+'@dsforever-login.com';const password=$('password').value;let result;if(registering){if(password.length<8)throw new Error('Password minimum 8 characters hona chahiye');result=await client.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim(),username:id}}});}else{result=await client.auth.signInWithPassword({email,password});}if(result.error)throw result.error;msg(registering?'Account created successfully!':'Login successful!','ok');}catch(err){msg(err.message,'err');}finally{btn.disabled=false;btn.textContent=registering?'✦ CREATE ACCOUNT':'⇥ LOGIN';}});
$('forgot').onclick=()=>msg('Password reset ke liye administrator se sampark karein.');
</script></body></html>
